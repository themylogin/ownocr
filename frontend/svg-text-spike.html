era-de-"],[231,1150,1426,1192,"otro; la ληθεíη misma pasa inadvertida porque ella misma es su"],[229,1200,1425,1245,"propio substraerse; de otro modo no podría entenderse (y, sin"],[231,1250,1426,1299,"embargo, está en el poema) que la ληθεiη o v εvαιes interna-"],[228,1306,1424,1350,"mente rechazo, que la referencia del rechazo lo es a un no-po-"],[229,1357,1424,1403,"der-ser-dicho, no-poder-ser-investigado, permanecer oculto, y"],[232,1415,1418,1459,"que en la λη9εin está la necesidad de la δóξα. La ληθεin se"],[231,1466,1425,1509,"substrae porque ella misma, en cuanto que es internamente re-"],[231,1518,1422,1560,"chazo del permanecer-oculto, está entregada al permanecer-"],[229,1571,1422,1615,"oculto. ¿Sería entonces una pirueta pseudointerpretativa decir"],[229,1621,1424,1668,"que el substraerse de la ληθεíη, de v εvαι, y con ello la"],[228,1676,1424,1721,"necesidad de la δóξα, reside en que φúσι xρúπτεσθαι φιλεī"],[230,1730,1421,1773,"(Heráclito, B 123)? Lo sería si con ello pretendiésemos estable-"],[228,1781,1422,1826,"cer alguna comunidad fáctica de representaciones entre Parmé-"],[229,1836,1421,1879,"nides y Heráclito, algo así como que las tesis de uno hubieran"],[228,1888,1421,1933,"podido ser fácilmente asumidas por el otro en el caso de que se"],[229,1940,1421,1982,"hubiesen conocido, etcétera; pero ese tipo de comunidad nos"],[229,1997,1420,2037,"interesa poco, y lo que, en cambio, nos ocupa es entender lo que"],[227,2096,293,2140,"122"]],[[188,221,1219,292,"tematización descriptiva (por ejemplo: el estudio"],[183,269,1129,340,"«propiedades químicas», la taxonomía vegetal"],[1411,298,1608,381,"tenga una"],[179,360,1236,435,"ejemplo, «la ciencia» tiene más o menos implícita"],[1331,380,1607,469,"tiene en todo"],[183,412,1205,475,"caso) la seguridad de que todo lo que constituye"],[1336,427,1607,510,"de un animal"],[179,458,1205,523,"sería en último análisis una maraña de procesos"],[1186,456,1609,558,"fisico-químicos, y de"],[174,809,1620,920,"(aquello que es a la vez su norma, su estructura y su lenguaje) es la"],[188,882,433,921,"matemática."],[218,905,1614,1001,"La «sociología» de Comte sigue siendo una especie de «fisica» (cuyo"],[176,952,1614,1043,"carácter de tal es concebido de un modo más o menos confuso). Si una"],[176,997,1614,1089,"consideración positivista de la historia es posible, la ausencia de tal"],[176,1045,1616,1133,"consideración en Comte se hace patente en el hecho de que, cuando"],[179,1095,1614,1172,"Comte habla de algo así como la historia, emplea nociones que de"],[176,1141,1614,1214,"«positivismo» no tienen otra cosa que la banalidad que sin duda tienen:"],[179,1186,1614,1259,"el «progreso», el «perfeccionamiento» de la humanidad y «creciente"],[183,1233,1614,1304,"predominio de las tendencias más nobles de nuestra naturaleza», etc.,"],[183,1279,1614,1349,"todo ello cosas que no son en absoluto de naturaleza «positiva» y que"],[186,1338,1292,1377,"son simplemente producto de una metafísica barata."],[225,1375,1605,1427,"Sin embargo, a mediados del siglo xix, y precisamente en Alemania"],[180,1419,1611,1473,"el ideal positivista penetra en campos que, al menos en principio, no"],[186,1468,1611,1515,"son el de «la naturaleza». Es por entonces cuando G. Th. Fechner"],[183,1507,1611,1562,"funda la psicología experimental; pero lo que Fechner fundamental-"],[183,1551,1611,1608,"mente hace es establecer, sobre la base de ciertos convenios, una ma-"],[180,1596,1611,1653,"nera coherente de atribuir cantidad a las sensaciones; por lo tanto,"],[176,1635,1616,1704,"su obra se sitúa en el camino de la reducción de toda ciencia al modo"],[179,1681,1619,1748,"de objetividad regido por la matemática. Mucha más importancia"],[179,1726,1619,1793,"(desde el punto de vista de lo que ahora nos ocupa) tiene la aparición"],[183,1765,1619,1844,"de una especie de positivismo en la investigación histórica; es la lla-"],[179,1811,1622,1889,"mada «escuela histórica» (citemos a Leopold von Ranke), cuya at-"],[186,1871,684,1925,"mósfera respira Dilthey."],[222,1897,1622,1979,"El propio Dilthey pertenece en cierta manera al ámbito del positi-"],[179,1945,1622,2024,"vismo; más exactamente: pertenece sólo en la medida en que se siente"],[183,1990,1622,2072,"liberado, gracias al positivismo, de las cadenas metafísicas que hasta"],[186,2044,1487,2111,"entonces hacían imposible una verdadera ciencia histórica; así:"],[228,2102,1622,2182,"1. Dilthey rechaza toda «metafisica de la historia», entendiendo por"],[186,2151,1622,2226,"tal toda noción de un «sentido último» de la historia, no importa que"],[179,2190,1624,2277,"ese «sentido último» tenga el carácter de un «fin» o el de un proceso"],[188,2255,991,2311,"subyacente o el de cualquier otra cosa."],[222,2288,1622,2376,"2. Dilthey rechaza la aplicación a la historia de nociones suprahis-"],[182,2333,1624,2423,"tóricas. Si se admite, por ejemplo, «la naturaleza humana» como algo"],[182,2377,1628,2474,"que tiene que ser común al hombre del siglo xix, al griego arcaico y al"],[191,2496,303,2564,"432"]]];
const PAGE_W = 2050, PAGE_H = 3050;
const IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';

const q = new URLSearchParams(location.search);
const CFG = {
  pages:   Number(q.get('pages') || 1000),
  cv:      q.get('cv') !== '0',
  grounds: q.get('grounds') || 'rect',
  text:    q.get('text') || 'all',
};

const GLYPH_HEIGHT = 0.78, BASELINE = 0.82;
const half = (document.documentElement.clientWidth - 32 - 16) / 2;
const SCALE = Math.min(1, half / PAGE_W);
const W = Math.floor(PAGE_W * SCALE), H = Math.floor(PAGE_H * SCALE);

const MARKER = 'ZQXJMARK';
const markerPages = new Set([
  Math.floor(CFG.pages * 0.25), Math.floor(CFG.pages * 0.5),
  Math.floor(CFG.pages * 0.75), CFG.pages - 1,
]);
document.getElementById('marker').textContent = MARKER + (CFG.pages - 1);

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Today's reader keeps text only for pages inside one viewport band. `near`
// reproduces that as the baseline to compare against.
const nearFirst = 0, nearLast = Math.ceil((window.innerHeight * 3) / H);

function svgFor(pageIndex) {
  const src = LINES[pageIndex % LINES.length];
  let grounds = '', glyphs = '', path = '';

  for (let i = 0; i < src.length; i++) {
    const [l, t, r, b] = src[i];
    let txt = src[i][4];
    if (i === 0 && markerPages.has(pageIndex)) txt += ' ' + MARKER + pageIndex;

    const w = r - l, h = b - t;
    if (CFG.grounds === 'rect') {
      grounds += '<rect x="' + l + '" y="' + t + '" width="' + w + '" height="' + h + '"/>';
    } else if (CFG.grounds === 'path') {
      path += 'M' + l + ' ' + t + 'H' + r + 'V' + b + 'H' + l + 'Z';
    }
    glyphs += '<text x="' + l + '" y="' + (t + h * BASELINE) + '" textLength="' + w +
              '" font-size="' + (h * GLYPH_HEIGHT) + '" lengthAdjust="spacingAndGlyphs">' +
              esc(txt) + '</text>';
  }
  if (CFG.grounds === 'path') grounds = '<path d="' + path + '"/>';

  return '<svg class="text" viewBox="0 0 ' + PAGE_W + ' ' + PAGE_H + '" preserveAspectRatio="none" ' +
         'xmlns="http://www.w3.org/2000/svg"><g class="grounds">' + grounds +
         '</g><g class="glyphs">' + glyphs + '</g></svg>';
}

function spreadFor(i) {
  const box = 'width:' + W + 'px;height:' + H + 'px';
  const img = '<img src="' + IMG + '" alt="" width="' + PAGE_W + '" height="' + PAGE_H + '" loading="lazy"';
  const withText = CFG.text === 'all' || (i >= nearFirst && i <= nearLast);

  return '<div class="spread" data-page="' + i + '">' +
         img + ' class="plain" style="' + box + '">' +
         '<div class="page" style="' + box + '">' +
         img + '>' +
         '<div class="veil"></div>' +
         (withText ? svgFor(i) : '') +
         '</div></div>';
}

const t0 = performance.now();
let html = '';
for (let i = 0; i < CFG.pages; i++) html += spreadFor(i);
const tBuilt = performance.now();

const container = document.getElementById('pages');

// Grammar is `auto? [ none | <length> ]{1,2}` -- ONE optional `auto`, then the
// lengths. A second `auto` makes the whole declaration invalid, the browser
// drops it, skipped pages collapse to zero height, and every page counts as
// on-screen. That failure looks exactly like content-visibility doing nothing.
let cisParsed = 'n/a';
if (CFG.cv) {
  const style = document.createElement('style');
  style.textContent = '.spread { content-visibility: auto; contain-intrinsic-size: auto ' +
                      (W * 2 + 16) + 'px ' + H + 'px; }';
  document.head.appendChild(style);
  const rule = style.sheet.cssRules[0].style;
  cisParsed = rule.getPropertyValue('contain-intrinsic-size') ? 'yes' : 'NO - DROPPED';
}
container.innerHTML = html;
const tInserted = performance.now();

// Long tasks split into two buckets that can never be confused: work that
// happened while the page loaded, and work after the last reset.
const load = { n: 0, total: 0, max: 0 };
const live = { n: 0, total: 0, max: 0 };
let paintedAt = Infinity, resetAt = Infinity, maxGap = 0, last = performance.now();

function bump(b, e) { b.n++; b.total += e.duration; b.max = Math.max(b.max, e.duration); }

try {
  new PerformanceObserver((list) => {
    for (const e of list.getEntries()) {
      if (e.startTime < paintedAt) bump(load, e);
      else if (e.startTime >= resetAt) bump(live, e);
    }
  }).observe({ type: 'longtask', buffered: true });
} catch (_) {}

requestAnimationFrame(() => requestAnimationFrame(() => {
  const tPainted = performance.now();
  paintedAt = tPainted; resetAt = tPainted;

  const probe = container.firstElementChild;
  const cs = probe ? getComputedStyle(probe) : null;
  const perPage = Math.round(LINES.reduce((a, p) => a + p.length, 0) / LINES.length);

  const rows = [
    ['pages', CFG.pages],
    ['&lt;text&gt; total', (CFG.text === 'all' ? CFG.pages : nearLast - nearFirst + 1) * perPage],
    ['DOM elements', document.getElementsByTagName('*').length],
    ['scroll height', Math.round(document.documentElement.scrollHeight / 1000) + 'k px'],
    ['SEP', ''],
    ['content-visibility', cs ? cs.getPropertyValue('content-visibility') : '?'],
    ['intrinsic size', cs ? (cs.getPropertyValue('contain-intrinsic-size') || 'none') : '?'],
    ['rule parsed', cisParsed],
    ['SEP', ''],
    ['string build', (tBuilt - t0).toFixed(0) + ' ms'],
    ['innerHTML parse', (tInserted - tBuilt).toFixed(0) + ' ms'],
    ['to first paint', (tPainted - tInserted).toFixed(0) + ' ms'],
    ['TOTAL', (tPainted - t0).toFixed(0) + ' ms'],
  ];
  if (performance.memory) {
    rows.push(['JS heap', (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + ' MB']);
  }

  document.getElementById('build').innerHTML = rows.map(([k, v]) =>
    k === 'SEP' ? '<tr><td colspan="2"><hr></td></tr>'
                : '<tr' + (k === 'TOTAL' || v === 'NO - DROPPED' ? ' class="warn"' : '') +
                  '><td>' + k + '</td><td>' + v + '</td></tr>').join('');

  // The expected height with 1000 pages is over a million px. A tiny number
  // here means the pages collapsed and every one of them counts as on-screen.
  if (CFG.cv && document.documentElement.scrollHeight < CFG.pages * H * 0.9) {
    document.getElementById('build').insertAdjacentHTML('afterbegin',
      '<tr class="warn"><td colspan="2">PAGES COLLAPSED - result invalid</td></tr>');
  }
}));

function tick(now) {
  const gap = now - last;
  if (gap > maxGap) maxGap = gap;
  last = now;
  document.getElementById('live').innerHTML =
    '<tr><td>load blocked</td><td>' + load.total.toFixed(0) + ' ms / max ' + load.max.toFixed(0) + '</td></tr>' +
    '<tr><td colspan="2"><hr></td></tr>' +
    '<tr class="warn"><td>max long task</td><td>' + live.max.toFixed(0) + ' ms</td></tr>' +
    '<tr class="warn"><td>max frame gap</td><td>' + maxGap.toFixed(0) + ' ms</td></tr>' +
    '<tr><td>long tasks</td><td>' + live.n + '</td></tr>' +
    '<tr><td>blocked total</td><td>' + live.total.toFixed(0) + ' ms</td></tr>';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.getElementById('reset').onclick = () => {
  live.n = live.total = live.max = 0; maxGap = 0;
  resetAt = last = performance.now();
};

// Reading a layout value inside a skipped subtree forces that subtree to lay
// out. This is the timeable stand-in for what find-in-page must do.
document.getElementById('force').onclick = (e) => {
  const t = performance.now();
  let n = 0, sum = 0;
  for (const el of document.querySelectorAll('.glyphs > text:first-child')) {
    sum += el.getComputedTextLength(); n++;
  }
  const ms = performance.now() - t;
  e.target.textContent = 'Forced ' + n + ' pages: ' + ms.toFixed(0) + ' ms' +
                         (sum === 0 ? ' (len 0 — not laid out!)' : '');
};

document.getElementById('variants').innerHTML =
  '<b>Variants:</b> ' + [
    ['cv=0', 'no content-visibility'],
    ['cv=1', 'content-visibility'],
    ['grounds=path', 'merged grounds'],
    ['grounds=none', 'no grounds'],
    ['text=near', 'today (lazy text)'],
    ['pages=200', '200 pages'],
  ].map(([p, label]) => {
    const u = new URLSearchParams(location.search);
    u.set(p.split('=')[0], p.split('=')[1]);
    return '<a href="?' + u + '">' + label + '</a>';
  }).join(' &middot; ') +
  '<br><b>Now:</b> pages=' + CFG.pages + ' cv=' + (CFG.cv ? 1 : 0) +
  ' grounds=' + CFG.grounds + ' text=' + CFG.text;
</script>
</body>
</html>
