services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      WORKERS: ${WORKERS:-4}
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      PDF_DPI: ${PDF_DPI:-300}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      DEWARP_API_URL: ${DEWARP_API_URL}
      DEWARP_API_TOKEN: ${DEWARP_API_TOKEN}
      PADDLEOCR_VL_API_URL: ${PADDLEOCR_VL_API_URL}
      PADDLEOCR_VL_API_TOKEN: ${PADDLEOCR_VL_API_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SIDECAR_URL: ${SIDECAR_URL:-http://sidecar:8000}
    volumes:
      - book_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build:
      context: ./sidecar
      target: prod
    volumes:
      - book_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - book_data:/data:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  book_data:
